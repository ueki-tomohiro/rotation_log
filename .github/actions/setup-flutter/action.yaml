name: setup flutter
description: setup flutter with mise
runs:
  using: "composite"
  steps:
    - name: setup java
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
    - name: install mise tools
      uses: jdx/mise-action@v2
      with:
        install: true
        cache: true
    - name: restore pub cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-pub-cache-${{ hashFiles('.tool-versions', '**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-cache-
    - name: restore pubspec cache
      uses: actions/cache@v4
      with:
        path: |
          .dart_tool
          packages/rotation_log/.dart_tool
          packages/rotation_log/example/.dart_tool
        key: ${{ runner.os }}-dart-tool-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-dart-tool-
    - name: install melos command
      run: |
        dart pub global activate melos
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      shell: bash
